[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blowdown-studio"
version = "2.5.0"
description = "API 520/521/2000 pressure safety valve sizing and blowdown analysis desktop application"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Blowdown Studio contributors" }]
keywords = ["PSV", "API 520", "API 521", "API 2000", "blowdown", "depressuring", "process-safety"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Engineering",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy~=2.4",
    "scipy~=1.17",
    "pandas~=2.3",
    "matplotlib~=3.10",
    "CoolProp~=7.2",
    "reportlab~=4.5",
    "hyddown==0.16.2",
    "cerberus~=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
    "mypy",
    "pre-commit",
]
build = ["pyinstaller~=6.20"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length is handled by formatter, not a lint failure here
]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
