name: Build Windows EXE

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v$(python -c 'from app_metadata import APP_VERSION; print(APP_VERSION)')"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Blowdown Studio $VERSION"

      - name: Build with PyInstaller
        run: |
          pyinstaller build.spec

      - name: Verify build
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "Blowdown Studio_*.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "EXE not found in dist/"
            exit 1
          }
          Write-Host "Build: $($exe.Name)  Size: $([math]::Round($exe.Length/1MB,1)) MB"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Blowdown Studio_*.exe
          name: Blowdown Studio ${{ steps.version.outputs.version }}
          body_path: RELEASE_v2.4.3_NOTES.txt
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
