name: CI / Build Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: |
          python -m pytest -q

  build:
    name: Build Windows EXE
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes from CHANGELOG
        shell: bash
        run: |
          python - "${{ github.ref_name }}" <<'PY'
          import re, sys
          tag = sys.argv[1]
          changelog = open('CHANGELOG.md', encoding='utf-8').read()
          match = re.search(
              r'(^## \[' + re.escape(tag) + r'\][^\n]*\n.*?)(?=^## \[|\Z)',
              changelog, re.MULTILINE | re.DOTALL)
          body = match.group(1).strip() if match else 'Blowdown Studio ' + tag
          open('release_body.md', 'w', encoding='utf-8').write(body)
          PY

      - name: Build with PyInstaller
        run: |
          pyinstaller build.spec

      - name: Verify build
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "Blowdown Studio_*.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "EXE not found in dist/"
            exit 1
          }
          Write-Host "Build: $($exe.Name)  Size: $([math]::Round($exe.Length/1MB,1)) MB"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Blowdown Studio_*.exe
          name: Blowdown Studio ${{ steps.version.outputs.version }}
          body_path: release_body.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
